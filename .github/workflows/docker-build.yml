# GitHub Actions Docker Build Workflow (Example)
#
# This workflow demonstrates best practices for building a production-ready Docker image
# for a Python Poetry project. It is triggered manually via `workflow_dispatch`.
#
# Best Practices Included:
# - Multi-stage Docker build to create lean production images.
# - Poetry is used in a builder stage to export a `requirements.txt` file.
# - The final image uses a standard Python base image and installs dependencies via pip.
# - Docker layer caching is enabled using the GitHub Actions cache backend for efficiency.
# - All actions are pinned to their full commit SHA for security.

name: Docker Build

on:
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push images to GitHub Packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile # Assuming Dockerfile is in the root
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          # 7. Docker Workflow Best Practices: Layer Caching
          cache-from: type=gha
          cache-to: type=gha,mode=max

# --- Example Multi-Stage Dockerfile for a Poetry Project ---
#
# This Dockerfile is not created by the agent, but serves as a reference for the user.
# It should be placed in the root of the repository.
#
# --- Dockerfile ---
#
# # --- Builder Stage ---
# # Use an official Python image that includes Poetry
# FROM python:3.12-slim as builder
#
# # Install poetry
# RUN pip install poetry
#
# # Set the working directory
# WORKDIR /app
#
# # Copy only the files necessary for dependency installation
# COPY pyproject.toml poetry.lock ./
#
# # Export dependencies to a requirements.txt file
# # --without-hashes is used to avoid issues with some packages on different platforms
# # The --only main flag ensures only production dependencies are included
# RUN poetry export -f requirements.txt --output requirements.txt --without-hashes --only main
#
# # --- Final Stage ---
# # Use a lean official Python runtime as a parent image
# FROM python:3.12-slim
#
# # Set the working directory
# WORKDIR /app
#
# # Copy the requirements.txt from the builder stage
# COPY --from=builder /app/requirements.txt .
#
# # Install the dependencies using pip
# RUN pip install --no-cache-dir -r requirements.txt
#
# # Copy the application source code
# COPY src/ ./src/
#
# # Set the entrypoint for the application
# ENTRYPOINT ["python", "src/pyscientificpdfparser/cli.py"]
#
# --- End Dockerfile ---