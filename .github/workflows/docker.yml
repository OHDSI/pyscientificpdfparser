# This workflow is designed to build, cache, and scan the Docker image.
# It adheres to best practices for security and efficiency.

name: Docker Build & Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Enforce the Principle of Least Privilege.
permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Log in to Docker Hub
        # This step is recommended to avoid rate-limiting on public image pulls.
        # It's conditional to handle forks securely, which won't have the secrets.
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        if: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        # This enables the use of BuildKit for more efficient, cached builds.
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and cache Docker image
        # This step builds the image and caches layers to speed up subsequent runs.
        # It loads the image into the local Docker daemon for the next step to use.
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          push: false
          tags: local-image:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        # This step scans the locally built image for security vulnerabilities.
        # It will fail the workflow if any CRITICAL or HIGH severity issues are found.
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: 'local-image:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
