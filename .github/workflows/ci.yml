# GitHub Actions CI Workflow for Python Poetry Project
#
# This workflow is designed with a focus on security, efficiency, and detailed logging.
# It implements a comprehensive testing matrix across multiple Python versions and operating systems.
#
# Security Best Practices:
# - GITHUB_TOKEN permissions are set to read-only by default.
# - All third-party GitHub Actions are pinned to their full commit SHA to prevent supply chain attacks.
#
# Efficiency and Debugging:
# - Concurrency control is enabled to cancel redundant workflow runs.
# - Jobs have a 15-minute timeout to prevent stalled runners.
# - Caching for Poetry dependencies is configured to speed up installations.
# - Verbose logging is enabled for all installation and testing steps (-vv).
# - Environment details are explicitly dumped for easier debugging.

name: CI

# 1. Core Workflow Requirements: Triggers
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 1. Core Workflow Requirements: Concurrency Control
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 2. Security: Principle of Least Privilege (PoLP)
permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # 1. Core Workflow Requirements: Timeouts
    timeout-minutes: 15

    # 3. Matrix Testing Strategy
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-2025]

    steps:
    # 2. Security: Action Pinning
    - name: Checkout repository
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    # 4. Poetry Integration: Install pipx and Poetry
    - name: Install Poetry
      run: |
        python3 -m pip install --user pipx
        python3 -m pipx install poetry

    # 4. Poetry Integration: Setup Python and enable Poetry caching
    - name: Set up Python ${{ matrix.python-version }}
      id: setup-python
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'poetry'

    # 4. Poetry Integration: Environment Dump for Debugging
    - name: Dump environment details
      run: |
        echo "OS/Runner: ${{ runner.os }}"
        echo "Python version:"
        python --version
        echo "Poetry version:"
        poetry --version
        echo "Poetry Environment Info:"
        poetry env info
        echo "PATH:"
        echo $PATH
      shell: bash

    # 4. Poetry Integration: Install Dependencies with high verbosity
    - name: Install dependencies
      run: poetry install --no-interaction --with dev -vv

    # 4. Poetry Integration: Dependency Verification for Debugging
    - name: Verify Dependency Tree
      run: poetry show --tree

    # 5a. Test Execution: Run Unit Tests
    # Assuming all tests in the 'tests/' directory are unit tests as no other structure is present.
    - name: Run Unit Tests
      run: poetry run pytest -vv tests/ --cov=./ --cov-report=xml:coverage-unit.xml

    # 5a. Test Execution: Run Integration Tests (Placeholder)
    # This step is included to fulfill the requested structure.
    # It is commented out and should be enabled when integration tests are available.
    # - name: Run Integration Tests
    #   run: poetry run pytest -vv tests/integration/ --cov=./ --cov-report=xml:coverage-integration.xml

    # 5b. Codecov Upload: Unit Test Coverage
    - name: Upload Unit Test coverage to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage-unit.xml
        flags: ${{ matrix.os }}-py${{ matrix.python-version }}-unit
        fail_ci_if_error: true
        verbose: true

    # 5b. Codecov Upload: Integration Test Coverage (Placeholder)
    # This step corresponds to the placeholder integration test step above.
    # - name: Upload Integration Test coverage to Codecov
    #   if: ${{ !cancelled() }}
    #   uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
    #   with:
    #     token: ${{ secrets.CODECOV_TOKEN }}
    #     file: ./coverage-integration.xml
    #     flags: ${{ matrix.os }}-py${{ matrix.python-version }}-integration
    #     fail_ci_if_error: true
    #     verbose: true

    # 6. Failure Handling: Upload Artifacts
    - name: Upload reports and logs on failure
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ci-failure-reports-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          coverage-unit.xml
          # coverage-integration.xml # Uncomment if integration tests are enabled
          # Add any other relevant log files here
          # *.log